name: CI

# Les tests tournent sur les trois systemes cibles. Sur une pull request,
# GitHub teste la fusion : le decodeur PNG apporte par une branche est donc
# confronte a Pillow avant qu'on parle de fusionner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.8" }
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv et Python ${{ matrix.python }}
        # uv telecharge l'interpreteur au lieu de dependre de ce que le runner
        # embarque, ce qui rend 3.8 eprouvable a nouveau : les images GitHub ne
        # le fournissent plus.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}

      - name: Suite de tests
        # --no-project : on eprouve l'arbre des sources tel quel, sans installer
        # le paquet, exactement comme avant. --with pillow fournit la reference
        # a laquelle le decodeur PNG maison est confronte, et disparait avec
        # l'environnement ephemere : doot lui-meme n'a aucune dependance.
        run: uv run --no-project --with pillow python -m unittest discover -s tests -v

      - name: Le paquet s'importe et la CLI repond
        # Aucune de ces commandes n'ouvre de fenetre : elles doivent passer
        # sur un runner sans serveur graphique.
        run: |
          uv run --no-project python -c "import doot, doot.cli, doot.sound, doot.screens, doot.window"
          uv run --no-project python -m doot --version
          uv run --no-project python -m doot --art
          uv run --no-project python -m doot --screens
          uv run --no-project python -m doot --paths

  scripts:
    name: Scripts shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe des installeurs
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Les installeurs sont executables
        # Un clone doit pouvoir lancer ./install.sh directement.
        run: |
          test -x install.sh || { echo "install.sh n'est pas executable"; exit 1; }
          test -x uninstall.sh || { echo "uninstall.sh n'est pas executable"; exit 1; }

      - name: Syntaxe PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('install.ps1', 'uninstall.ps1')) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $errors | ForEach-Object { Write-Host "$file : $_" }
                  exit 1
              }
              Write-Host "$file : syntaxe correcte"
          }
